<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>دكّاني — حسابي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--g1:#1b5e20;--g2:#2e7d32;--g4:#43a047;--gp:#e8f5e9;--gx:#f1f8e9;--acc:#00c853;--w:#fff;--g100:#f3f4f6;--g200:#e5e7eb;--g400:#9ca3af;--g800:#1f2937;--red:#e53935;--sh:0 2px 8px rgba(0,0,0,.08);--nav:65px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--g100);color:var(--g800);padding-bottom:calc(var(--nav)+20px)}

.hdr{background:linear-gradient(135deg,#1a4a1e,var(--g2));padding:24px 16px 20px;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.2)}
.avatar{width:72px;height:72px;background:var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px;box-shadow:0 4px 16px rgba(0,200,83,.4)}
.user-name{color:#fff;font-size:18px;font-weight:900}
.user-info{color:rgba(255,255,255,.65);font-size:12px;margin-top:4px;direction:ltr;display:inline-block}
.vip-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,215,0,.2);border:1px solid rgba(255,215,0,.4);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;color:#ffd700;margin-top:8px}
.content{padding:16px}
.card{background:var(--w);border-radius:16px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden;border:1px solid var(--g200)}
.card-title{padding:13px 18px;border-bottom:1px solid var(--g200);font-size:13px;font-weight:900;color:var(--g1)}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--g200)}
.stat{background:var(--w);padding:14px 10px;text-align:center}
.stat-val{font-size:20px;font-weight:900;color:var(--g2)}
.stat-lbl{font-size:10px;color:var(--g400);margin-top:3px}
.menu-item{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--g200);cursor:pointer;transition:background .2s;text-decoration:none}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:var(--gx)}
.mi-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.mi-name{font-size:13.5px;font-weight:700;color:var(--g800);flex:1}
.mi-desc{font-size:11px;color:var(--g400);margin-top:1px}
.mi-arrow{color:var(--g400);font-size:16px}
.danger-btn{width:100%;padding:14px;background:#ffebee;color:var(--red);border:none;border-radius:12px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;margin-bottom:10px}
.danger-btn:hover{background:var(--red);color:#fff}
.logout-btn{width:100%;padding:14px;background:var(--g100);color:var(--g800);border:none;border-radius:12px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.logout-btn:hover{background:var(--g200)}
.edit-field{margin-bottom:12px}
.edit-field label{display:block;font-size:12px;font-weight:700;color:var(--g2);margin-bottom:5px}
.edit-field input,.edit-field textarea{width:100%;padding:10px 13px;border:1.5px solid var(--g200);border-radius:9px;font-family:'Cairo',sans-serif;font-size:16px;outline:none;background:#f9fafb}
.edit-field input:focus,.edit-field textarea:focus{border-color:var(--g4);background:#fff}
.edit-field textarea{resize:none}
.save-btn{width:100%;padding:13px;background:var(--g2);color:#fff;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer}

/* --- القالب الموحد لشريط التنقل السفلي --- */
.bnav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    height: var(--nav);
    display: flex;
    align-items: center;
    border-top: 1px solid rgba(0,0,0,0.05);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
    z-index: 2000;
    padding-bottom: env(safe-area-inset-bottom);
}
.bni {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; text-decoration: none; color: #8e8e93; 
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
}
.bni-ico { width: 28px; height: 28px; display:flex; align-items:center; justify-content:center; transition: 0.3s; }
.bni-lbl { font-size: 10px; font-weight: 700; font-family: 'Cairo', sans-serif; }

/* الحالة النشطة */
.bni.active { color: var(--g1); }
.bni.active .bni-ico { transform: translateY(-2px); }
.bni.active .bni-lbl { color: var(--g1); }

/* شارة التنبيه */
.bni-badge {
    position: absolute; top: 4px; right: calc(50% - 18px);
    background: var(--acc); color: var(--g1); font-size: 9px; font-weight: 900;
    min-width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; border: 2px solid #fff;
}
.nav-icon{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.bni.active .nav-icon{stroke:var(--g1, var(--g2))}
</style>
</head>
<body>

<div class="hdr">
  <div class="avatar" id="avatar"></div>
  <div class="user-name" id="user-name">جاري التحميل...</div>
  <div class="user-info" id="user-phone"></div>
  <div id="vip-wrap"></div>
</div>

<div class="content">
  <!-- الإحصائيات -->
  <div class="card">
    <div class="stats-row">
      <div class="stat"><div class="stat-val" id="st-orders">0</div><div class="stat-lbl">طلب</div></div>
      <div class="stat"><div class="stat-val" id="st-spent">0₪</div><div class="stat-lbl">إجمالي</div></div>
      <div class="stat"><div class="stat-val" id="st-area">—</div><div class="stat-lbl">منطقتي</div></div>
    </div>
  </div>

  <!-- تعديل البيانات -->
  <div class="card">
    <div class="card-title">✏️ تعديل بياناتي</div>
    <div style="padding:16px">
      <div class="edit-field"><label>الاسم</label><input type="text" id="edit-name"></div>
      <div class="edit-field"><label>الهاتف</label><input type="tel" id="edit-phone" dir="ltr"></div>
      <div class="edit-field"><label>واتساب</label><input type="tel" id="edit-wa" dir="ltr"></div>
      <div class="edit-field"><label>المنطقة</label><input type="text" id="edit-hood"></div>
      <div class="edit-field"><label>العنوان</label><textarea id="edit-addr" rows="2"></textarea></div>
      <button class="save-btn" onclick="saveEdits()">💾 حفظ التعديلات</button>
    </div>
  </div>

  <!-- خيارات الحساب -->
  <div class="card">
    <div class="card-title">⚙️ خيارات الحساب</div>
    <a class="menu-item" href="/orders-history">
      <div class="mi-ico" style="background:#e3f2fd">📋</div>
      <div><div class="mi-name">سجل طلباتي</div><div class="mi-desc">عرض جميع طلباتك السابقة</div></div>
      <span class="mi-arrow">←</span>
    </a>
    <a class="menu-item" href="/contact">
      <div class="mi-ico" style="background:#e8f5e9">WA</div>
      <div><div class="mi-name">تواصل معنا</div><div class="mi-desc">واتساب أو اتصال مباشر</div></div>
      <span class="mi-arrow">←</span>
    </a>
  </div>

  <!-- الخيارات الخطرة -->
  <button class="danger-btn" onclick="deleteAccount()">
    حذف حسابي نهائياً
  </button>
  <button class="logout-btn" onclick="logout()">
    🚪 تسجيل الخروج
  </button>
</div>

<nav class="bnav">
  <!-- المتجر -->
  <a class="bni" href="/shop">
    <span class="bni-ico">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5V20h16v-9.5"/><path d="M3 10.5 5 4h14l2 6.5"/><path d="M8 20v-5h5v5"/><path d="M3 10.5h18"/></svg>
    </span>
    <span class="bni-lbl">المتجر</span>
  </a>
  <!-- السلة -->
  <a class="bni" href="/cart">
    <span class="bni-ico">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M3 4h2.2l2.1 10.4a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6.1"/></svg>
    </span>
    <span class="bni-lbl">السلة</span>
    <span class="bni-badge" id="nav-cart-count" style="display:none">0</span>
  </a>
  <!-- تواصل -->
  <a class="bni" href="/contact">
    <span class="bni-ico">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L4 20l1.2-4.1A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8.8 8.9c.3 3 2.5 5.2 5.4 5.9l1.5-1.5 2.3 1.1c-.3 1.7-1.6 2.7-3.4 2.4-4.2-.7-7.1-3.6-7.7-7.7-.3-1.8.7-3 2.4-3.4l1.1 2.3-1.6.9Z"/></svg>
    </span>
    <span class="bni-lbl">تواصل</span>
  </a>
  <!-- طلباتي -->
  <a class="bni" href="/orders-history">
    <span class="bni-ico">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v16l-3-1.8-3 1.8-3-1.8L7 21V5a2 2 0 0 1 2-2Z"/><path d="M9.5 8h5"/><path d="M9.5 12h5"/><path d="M9.5 16h3"/></svg>
    </span>
    <span class="bni-lbl">طلباتي</span>
  </a>
  <!-- حسابي (نشط) -->
  <a class="bni active" href="/account">
    <span class="bni-ico">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
    </span>
    <span class="bni-lbl">حسابي</span>
  </a>
</nav>

<script>
const profile = JSON.parse(localStorage.getItem('dokkani_profile') || '{}');

function loadProfile(){
  if(!profile.name){
    window.location.href='/'; return;
  }
  document.getElementById('avatar').textContent = profile.name[0] || '';
  document.getElementById('user-name').textContent = profile.name;
  document.getElementById('user-phone').textContent = profile.phone;
  document.getElementById('st-area').textContent = profile.neighborhood ? profile.neighborhood.substring(0,5) : '—';

  document.getElementById('edit-name').value  = profile.name || '';
  document.getElementById('edit-phone').value = profile.phone || '';
  document.getElementById('edit-wa').value    = profile.whatsapp || '';
  document.getElementById('edit-hood').value  = profile.neighborhood || '';
  document.getElementById('edit-addr').value  = profile.address || '';

  fetch('/api/orders/by-phone',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({phone: profile.phone})
  })
  .then(r=>r.json())
  .then(data=>{
    const orders = data.orders || [];
    const total  = orders.reduce((s,o)=>s+(o.final_total || ((o.total || 0) + (o.delivery || 0))),0);
    document.getElementById('st-orders').textContent = orders.length;
    document.getElementById('st-spent').textContent  = total.toFixed(0)+'₪';
    if(orders.length >= 3){
      document.getElementById('vip-wrap').innerHTML = '<div class="vip-badge">زبون VIP</div>';
    }
  });
}

function saveEdits(){
  profile.name         = document.getElementById('edit-name').value.trim();
  profile.phone        = document.getElementById('edit-phone').value.trim();
  profile.whatsapp     = document.getElementById('edit-wa').value.trim();
  profile.neighborhood = document.getElementById('edit-hood').value.trim();
  profile.address      = document.getElementById('edit-addr').value.trim();
  localStorage.setItem('dokkani_profile', JSON.stringify(profile));
  alert('تم حفظ التعديلات');
  location.reload();
}

function logout(){
  if(!confirm('هل تريد تسجيل الخروج؟\nستحتاج لإدخال بياناتك مجدداً')) return;
  localStorage.removeItem('dokkani_profile');
  localStorage.removeItem('dokkani_cart');
  window.location.href='/';
}

function deleteAccount(){
  if(!confirm('هل أنت متأكد من حذف حسابك نهائياً؟\nلا يمكن التراجع عن هذا الإجراء.')) return;
  fetch('/api/customer/delete',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({phone: profile.phone})
  })
  .then(()=>{
    localStorage.removeItem('dokkani_profile');
    localStorage.removeItem('dokkani_cart');
    alert('تم حذف حسابك بنجاح');
    window.location.href='/';
  });
}

loadProfile();

// منع التكبير اليدوي لضمان استقرار التطبيق
document.addEventListener('touchstart', function(event) {
  if (event.touches.length > 1) { event.preventDefault(); }
}, { passive: false });
document.addEventListener('gesturestart', function(event) {
  event.preventDefault();
});
</script>
</body>
</html>
