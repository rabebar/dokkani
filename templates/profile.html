<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>دكّاني — بياناتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دكّاني">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:linear-gradient(145deg,#1b5e20 0%,#2e7d32 60%,#1b5e20 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.3);animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.hdr{background:linear-gradient(135deg,#1b5e20,#43a047);padding:28px 24px 22px;text-align:center;position:relative;overflow:hidden}
.hdr::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07)}
.logo{width:62px;height:62px;background:#00c853;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px;box-shadow:0 4px 18px rgba(0,200,83,.45)}
.hdr h1{color:#fff;font-size:24px;font-weight:900}
.hdr p{color:rgba(255,255,255,.72);font-size:13px;margin-top:4px}
.form{padding:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:#2e7d32;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;outline:none;transition:all .2s;background:#f9fafb}
.field input:focus,.field textarea:focus{border-color:#43a047;background:#fff;box-shadow:0 0 0 3px rgba(67,160,71,.1)}
.field textarea{resize:none}
.loc-btn{width:100%;padding:13px;background:#e8f5e9;border:1.5px dashed #43a047;border-radius:10px;font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:700;color:#2e7d32;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.loc-btn.ok{background:#c8e6c9;border-style:solid;border-color:#2e7d32}
.loc-status{font-size:11.5px;color:#43a047;margin-top:6px;text-align:center;display:none}
.submit-btn{width:100%;padding:15px;background:linear-gradient(135deg,#43a047,#2e7d32);color:#fff;border:none;border-radius:12px;font-family:'Cairo',sans-serif;font-size:16px;font-weight:900;cursor:pointer;margin-top:6px;box-shadow:0 4px 16px rgba(46,125,50,.35);transition:all .2s}
.submit-btn:hover{transform:translateY(-2px)}
.err{color:#e53935;font-size:11px;margin-top:4px;display:none}
.foot{text-align:center;padding:14px 24px 18px;border-top:1px solid #f0f0f0;font-size:12px;color:#aaa}
.foot a{color:#2e7d32;font-weight:700;text-decoration:none;direction:ltr;display:inline-block}
/* شريط التثبيت */
.install-bar{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#1b5e20,#2e7d32);padding:14px 16px;display:none;align-items:center;justify-content:space-between;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);animation:slideDown .4s ease}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.install-bar.show{display:flex}
.install-txt .t1{color:#fff;font-size:14px;font-weight:900}
.install-txt .t2{color:rgba(255,255,255,.8);font-size:11px;margin-top:2px}
.install-btn{background:#00c853;color:#1b5e20;border:none;padding:10px 20px;border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:900;cursor:pointer}
.install-close{color:rgba(255,255,255,.7);background:none;border:none;font-size:22px;cursor:pointer;padding:0 6px}
/* أزرار التبديل */
.tab-btn { flex: 1; padding: 10px; border: none; border-radius: 9px; font-family: 'Cairo'; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.3s; }
.tab-active { background: #2e7d32; color: #fff; }
.tab-inactive { background: transparent; color: #2e7d32; }
</style>
</head>
<body>

<div class="install-bar" id="install-bar">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="font-size:28px">📲</div>
    <div class="install-txt">
      <div class="t1">ثبّت دكّاني على هاتفك!</div>
      <div class="t2">وصول سريع بضغطة واحدة 🚀</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <button class="install-btn" onclick="installApp()">تثبيت</button>
    <button class="install-close" onclick="closeInstall()">✕</button>
  </div>
</div>

<div class="card">
  <div class="hdr">
    <div class="logo">🛒</div>
    <h1>{{ app_name }}</h1>
    <p>سجّل بياناتك مرة واحدة فقط 🚀</p>
  </div>

  <div style="display: flex; background: #f1f8e9; margin: 15px 22px 0; border-radius: 12px; padding: 4px;">
    <button id="tab-new" onclick="switchMode('new')" class="tab-btn tab-active">مشترك جديد</button>
    <button id="tab-old" onclick="switchMode('old')" class="tab-btn tab-inactive">طلبت من قبل؟</button>
  </div>

  <div class="form">
    <div class="field" id="field-name">
      <label>👤 الاسم الكامل *</label>
      <input type="text" id="name" placeholder="مثال: أحمد محمود الخطيب">
      <div class="err" id="err-name">الرجاء إدخال الاسم</div>
    </div>
    <div class="field">
      <label>📞 رقم الهاتف *</label>
      <input type="tel" id="phone" placeholder="مثال: 059XXXXXXX">
      <div class="err" id="err-phone">الرجاء إدخال رقم صحيح</div>
    </div>
    <div class="field" id="field-whatsapp">
      <label>💬 واتساب (اختياري)</label>
      <input type="tel" id="whatsapp" placeholder="مثال: 059XXXXXXX">
    </div>
    <div class="field" id="field-hood">
      <label>🏘️ الحي والمنطقة *</label>
      <input type="text" id="neighborhood" placeholder="مثال: البالوع، المنارة، الطيرة...">
      <div class="err" id="err-hood">الرجاء إدخال المنطقة</div>
    </div>
    <div class="field" id="field-addr">
      <label>🏢 العنوان الكامل *</label>
      <textarea id="address" rows="2" placeholder="اسم العمارة، رقم الطابق، رقم الشقة..."></textarea>
      <div class="err" id="err-addr">الرجاء إدخال العنوان</div>
    </div>
    <div class="field" id="field-loc">
      <label>📍 موقعك على الخريطة (اختياري)</label>
      <button class="loc-btn" id="loc-btn" type="button" onclick="getLocation()">
        <span id="loc-icon">📍</span>
        <span id="loc-text">حدد موقعي تلقائياً</span>
      </button>
      <div class="loc-status" id="loc-status"></div>
    </div>

    <button id="login-btn" class="submit-btn" onclick="checkCustomer()" style="display: none; background: linear-gradient(135deg, #1b5e20, #2e7d32);">
      🔍 دخول واستعادة بياناتي
    </button>

    <button id="save-btn" class="submit-btn" onclick="saveProfile()">
      ✅ احفظ وابدأ التسوق
    </button>
  </div>
  <div class="foot">
    للدعم: <a href="tel:+970{{ app_phone }}" dir="ltr">{{ app_phone }}</a>
  </div>
</div>

<script>
let uLat = null, uLng = null, deferredPrompt = null;

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/service-worker.js').catch(e => console.log('SW error:', e));
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-bar').classList.add('show');
});

async function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  if(result.outcome === 'accepted') document.getElementById('install-bar').classList.remove('show');
  deferredPrompt = null;
}

function closeInstall(){ document.getElementById('install-bar').classList.remove('show'); }

function switchMode(mode) {
  const isNew = mode === 'new';
  document.getElementById('tab-new').className = isNew ? 'tab-btn tab-active' : 'tab-btn tab-inactive';
  document.getElementById('tab-old').className = isNew ? 'tab-btn tab-inactive' : 'tab-btn tab-active';
  
  const display = isNew ? 'block' : 'none';
  document.getElementById('field-name').style.display = display;
  document.getElementById('field-whatsapp').style.display = display;
  document.getElementById('field-hood').style.display = display;
  document.getElementById('field-addr').style.display = display;
  document.getElementById('field-loc').style.display = display;
  
  document.getElementById('save-btn').style.display = isNew ? 'block' : 'none';
  document.getElementById('login-btn').style.display = isNew ? 'none' : 'block';
}

function checkCustomer() {
  const phone = document.getElementById('phone').value.trim();
  if(!phone) { alert('يرجى إدخال رقم الهاتف أولاً'); return; }
  
  const btn = document.getElementById('login-btn');
  const originalText = btn.textContent;
  btn.textContent = '⏳ جاري التحقق...';
  btn.disabled = true;

  fetch(`/api/get-customer/${phone}`)
    .then(r => r.json())
    .then(data => {
      if(data.success) {
        localStorage.setItem('dokkani_profile', JSON.stringify(data.customer));
        alert(`أهلاً بك مجدداً يا ${data.customer.name} ✨`);
        window.location.href = '/shop';
      } else {
        alert('عذراً، هذا الرقم غير مسجل عندنا. يرجى التسجيل كـ "مشترك جديد"');
        switchMode('new');
      }
    })
    .catch(e => alert('خطأ في الاتصال بالسيرفر'))
    .finally(() => {
      btn.textContent = originalText;
      btn.disabled = false;
    });
}

window.onload = () => {
  const saved = localStorage.getItem('dokkani_profile');
  if(saved){
    try {
      const p = JSON.parse(saved);
      if(p.name && p.phone) window.location.href = '/shop';
    } catch(e) {}
  }
};

function getLocation(){
  const btn = document.getElementById('loc-btn');
  const st  = document.getElementById('loc-status');
  document.getElementById('loc-text').textContent = 'جاري التحديد...';
  document.getElementById('loc-icon').textContent = '⏳';
  navigator.geolocation.getCurrentPosition(
    pos => {
      uLat = pos.coords.latitude; uLng = pos.coords.longitude;
      document.getElementById('loc-text').textContent = '✅ تم تحديد موقعك!';
      document.getElementById('loc-icon').textContent = '';
      btn.classList.add('ok');
      st.textContent = '📍 سيصلك المندوب مباشرة على موقعك';
      st.style.display = 'block';
    },
    () => {
      document.getElementById('loc-text').textContent = 'حدد موقعي تلقائياً';
      document.getElementById('loc-icon').textContent = '📍';
      st.textContent = '⚠️ يمكنك المتابعة بدون تحديد الموقع';
      st.style.display = 'block';
    }
  );
}

function showErr(id, show){ document.getElementById(id).style.display = show ? 'block' : 'none'; }

function saveProfile(){
  const name         = document.getElementById('name').value.trim();
  const phone        = document.getElementById('phone').value.trim();
  const whatsapp     = document.getElementById('whatsapp').value.trim();
  const neighborhood = document.getElementById('neighborhood').value.trim();
  const address      = document.getElementById('address').value.trim();

  let valid = true;
  showErr('err-name', !name);  if(!name) valid=false;
  showErr('err-phone',!phone); if(!phone) valid=false;
  showErr('err-hood', !neighborhood); if(!neighborhood) valid=false;
  showErr('err-addr', !address); if(!address) valid=false;
  if(!valid) return;

  localStorage.setItem('dokkani_profile', JSON.stringify({
    name, phone, whatsapp, neighborhood, address, lat:uLat, lng:uLng
  }));
  window.location.href = '/shop';
}
</script>
</body>
</html>
