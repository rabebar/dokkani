<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>دكّاني — طلباتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--g1:#1b5e20;--g2:#2e7d32;--g4:#43a047;--gp:#e8f5e9;--gx:#f1f8e9;--acc:#00c853;--w:#fff;--g100:#f3f4f6;--g200:#e5e7eb;--g400:#9ca3af;--g800:#1f2937;--sh:0 2px 8px rgba(0,0,0,.08);--nav:60px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--g100);color:var(--g800);padding-bottom:calc(var(--nav)+16px)}
.hdr{background:linear-gradient(135deg,#1a4a1e,var(--g2));padding:16px;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.2)}
.hdr h1{color:#fff;font-size:19px;font-weight:900}
.hdr p{color:rgba(255,255,255,.65);font-size:12px;margin-top:3px}
.content{padding:16px}
.empty-state{text-align:center;padding:50px 20px;color:var(--g400)}
.empty-ico{font-size:55px;margin-bottom:14px}
.empty-title{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--g800)}
.shop-btn{display:inline-block;margin-top:14px;padding:12px 24px;background:var(--g2);color:#fff;border-radius:12px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;text-decoration:none}
.order-card{background:var(--w);border-radius:16px;box-shadow:var(--sh);margin-bottom:13px;overflow:hidden;border:1.5px solid var(--g200)}
.oc-hdr{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--g200)}
.oc-id{font-size:14px;font-weight:900;color:var(--g2)}
.oc-date{font-size:11px;color:var(--g400)}
.status-badge{padding:4px 11px;border-radius:18px;font-size:11px;font-weight:700}
.st-new{background:#e3f2fd;color:#1565c0}
.st-prep{background:#fff8e1;color:#e65100}
.st-delivering{background:#f3e5f5;color:#6a1b9a}
.st-done{background:var(--gp);color:var(--g1)}
.st-cancelled{background:#ffebee;color:#c62828}
.oc-body{padding:13px 16px}
.oc-items{font-size:12.5px;color:var(--g600);margin-bottom:10px;line-height:1.7}
.oc-foot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px dashed var(--g200)}
.oc-total{font-size:15px;font-weight:900;color:var(--g1)}
.reorder-btn{padding:7px 16px;background:var(--gp);border:none;border-radius:9px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;color:var(--g2);cursor:pointer;transition:all .2s}
.reorder-btn:hover{background:var(--g4);color:#fff}
.loading{text-align:center;padding:40px;color:var(--g400);font-size:13px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--w);height:var(--nav);display:flex;align-items:center;border-top:1px solid var(--g200);box-shadow:0 -4px 20px rgba(0,0,0,.08);z-index:200}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;text-decoration:none;padding:6px 0}
.bni-ico{font-size:22px;line-height:1}
.bni-lbl{font-size:9.5px;font-weight:700;color:var(--g400)}
.bni.active .bni-lbl{color:var(--g2)}
</style>
</head>
<body>

<div class="hdr">
  <h1>📋 سجل طلباتي</h1>
  <p>جميع طلباتك السابقة</p>
</div>

<div class="content" id="content">
  <div class="loading">⏳ جاري تحميل طلباتك...</div>
</div>

<nav class="bnav">
  <!-- المتجر: واجهة محل خضراء -->
  <a class="bni" href="/shop">
    <span class="bni-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#1b5e20"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
    </span>
    <span class="bni-lbl">المتجر</span>
  </a>

  <!-- السلة: سلة تسوق -->
  <a class="bni" href="/cart">
    <span class="bni-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    </span>
    <span class="bni-lbl">السلة</span>
    <span class="bni-badge" id="nav-cart-count" style="display:none">0</span>
  </a>

  <!-- تواصل: واتساب ملون -->
  <a class="bni" href="/contact">
    <span class="bni-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </span>
    <span class="bni-lbl">تواصل</span>
  </a>

  <!-- طلباتي: دفتر سجل مفتوح (نشط الآن) -->
  <a class="bni active" href="/orders-history">
    <span class="bni-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </span>
    <span class="bni-lbl">طلباتي</span>
  </a>

  <!-- حسابي: بروفايل -->
  <a class="bni" href="/account">
    <span class="bni-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </span>
    <span class="bni-lbl">حسابي</span>
  </a>
</nav>

<script>
const profile = JSON.parse(localStorage.getItem('dokkani_profile') || '{}');
const statusClass = {
  new:'st-new', prep:'st-prep',
  delivering:'st-delivering', done:'st-done', cancelled:'st-cancelled'
};

function formatDate(dt){
  if(!dt) return '';
  const d = new Date(dt);
  return d.toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

function renderOrders(orders){
  const c = document.getElementById('content');
  if(!orders.length){
    c.innerHTML = `
      <div class="empty-state">
        <div class="empty-ico">📭</div>
        <div class="empty-title">لا توجد طلبات بعد</div>
        <div style="font-size:12px">لم تقم بأي طلب حتى الآن</div>
        <a class="shop-btn" href="/shop">🛒 ابدأ التسوق</a>
      </div>`;
    return;
  }
  c.innerHTML = orders.map(o => {
    const items = Array.isArray(o.items) ? o.items : [];
    const itemsText = items.slice(0,3).map(i=>`${i.name} ×${i.qty}`).join(' • ');
    const more = items.length > 3 ? ` • +${items.length-3} أخرى` : '';
    return `
    <div class="order-card">
      <div class="oc-hdr">
        <div>
          <div class="oc-id">#${o.id}</div>
          <div class="oc-date">${formatDate(o.created_at)}</div>
        </div>
        <span class="status-badge ${statusClass[o.status]||'st-new'}">${o.status_text}</span>
      </div>
      <div class="oc-body">
        <div class="oc-items">${itemsText}${more}</div>
        <div class="oc-foot">
          <div class="oc-total">الإجمالي: ${o.total}₪</div>
          <button class="reorder-btn" onclick="reorder(${JSON.stringify(items).replace(/"/g,'&quot;')})">🔁 إعادة الطلب</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function reorder(items){
  let cart = JSON.parse(localStorage.getItem('dokkani_cart') || '[]');
  items.forEach(item => {
    const ex = cart.find(i=>i.id===item.id);
    if(ex){ ex.qty += item.qty; }
    else { cart.push(item); }
  });
  localStorage.setItem('dokkani_cart', JSON.stringify(cart));
  window.location.href = '/cart';
}

// تحميل الطلبات
window.onload = () => {
  if(!profile.phone){
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-ico">👤</div>
        <div class="empty-title">سجّل بياناتك أولاً</div>
        <a class="shop-btn" href="/">تسجيل البيانات</a>
      </div>`;
    return;
  }
  fetch('/api/orders/by-phone', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({phone: profile.phone})
  })
  .then(r=>r.json())
  .then(data => renderOrders(data.orders || []))
  .catch(()=>{
    document.getElementById('content').innerHTML =
      '<div class="loading">❌ تعذر تحميل الطلبات</div>';
  });
};

// منع التكبير اليدوي لضمان استقرار التطبيق
document.addEventListener('touchstart', function(event) {
  if (event.touches.length > 1) { event.preventDefault(); }
}, { passive: false });
document.addEventListener('gesturestart', function(event) {
  event.preventDefault();
});
</script>
</body>
</html>
