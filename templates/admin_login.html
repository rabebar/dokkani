<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دكّاني — تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#1a4a1e,#2e7d32,#1b5e20);min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:20px;padding:40px 36px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
.logo{width:64px;height:64px;background:linear-gradient(135deg,#43a047,#1b5e20);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px}
.title{font-size:22px;font-weight:900;color:#1b5e20;font-family:'Tajawal',sans-serif;margin-bottom:4px}
.sub{font-size:12px;color:#9ca3af;margin-bottom:28px}
.field{position:relative;margin-bottom:16px}
.field input{width:100%;padding:13px 16px;border:1.5px solid #e5e7eb;border-radius:12px;font-family:'Cairo',sans-serif;font-size:14px;outline:none;transition:border .2s;text-align:center;letter-spacing:2px}
.field input:focus{border-color:#43a047}
.field label{position:absolute;top:-9px;right:14px;background:#fff;padding:0 6px;font-size:11px;color:#9ca3af;font-weight:700}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#43a047,#2e7d32);color:#fff;border:none;border-radius:12px;font-family:'Cairo',sans-serif;font-size:15px;font-weight:900;cursor:pointer;transition:opacity .2s;margin-top:4px}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.error{background:#fce4ec;color:#c62828;padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:700;margin-bottom:16px}
.footer{margin-top:22px;font-size:11px;color:#9ca3af}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🛒</div>
  <div class="title">{{ app_name }}</div>
  <div class="sub">لوحة تحكم المدير — أدخل كلمة السر</div>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label>كلمة السر</label>
      <input type="password" name="password" placeholder="••••••••" autofocus required>
    </div>
    <button type="submit" class="btn">🔐 دخول</button>
  </form>

  <div class="footer">دكّاني © 2025 — رام الله 🇵🇸</div>
</div>
</body>
</html>
