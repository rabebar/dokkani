<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>دكّاني — السلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--g1:#1b5e20;--g2:#2e7d32;--g4:#43a047;--gp:#e8f5e9;--gx:#f1f8e9;--acc:#00c853;--g100:#f3f4f6;--g200:#e5e7eb;--g400:#9ca3af;--g800:#1f2937;--red:#e53935;--sh:0 2px 8px rgba(0,0,0,.08);--r:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--g100);color:var(--g800);padding-bottom:100px}
.hdr{background:linear-gradient(135deg,#1a4a1e,var(--g2));padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.back-btn{width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:none;color:#fff;flex-shrink:0}
.hdr-title{color:#fff;font-size:17px;font-weight:900}
.hdr-sub{color:rgba(255,255,255,.65);font-size:11px;margin-top:1px}
.section{background:#fff;border-radius:var(--r);margin:12px 14px 0;box-shadow:var(--sh);overflow:hidden}
.sec-hdr{padding:12px 16px;border-bottom:1px solid var(--g200);font-size:13px;font-weight:900;color:var(--g1);display:flex;align-items:center;gap:7px}
.cart-item{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--g200)}
.cart-item:last-child{border-bottom:none}
.ci-ico{width:40px;height:40px;background:var(--gx);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.ci-ico img{width:100%;height:100%;object-fit:cover}
.ci-info{flex:1}
.ci-name{font-size:13px;font-weight:700}
.ci-unit{font-size:11px;color:var(--g400);margin-top:2px}
.ci-qty{display:flex;align-items:center;gap:7px}
.qb{width:26px;height:26px;border-radius:7px;background:var(--gp);border:none;font-size:14px;font-weight:700;color:var(--g2);cursor:pointer}
.qn{font-size:13px;font-weight:700;min-width:20px;text-align:center}
.ci-price{font-size:14px;font-weight:900;color:var(--g2);min-width:50px;text-align:left}
.del-btn{width:26px;height:26px;background:#ffebee;border-radius:7px;border:none;cursor:pointer;font-size:13px;flex-shrink:0}
.note-inp{width:100%;padding:11px 14px;border:none;font-family:'Cairo',sans-serif;font-size:16px;outline:none;color:var(--g800);resize:none;background:transparent}
.note-inp::placeholder{color:var(--g400)}
.summary{padding:14px 16px}
.sr{display:flex;justify-content:space-between;font-size:13px;color:#555;padding:5px 0}
.sr.total{font-size:16px;font-weight:900;color:var(--g1);border-top:1.5px dashed var(--g200);margin-top:8px;padding-top:10px}
.sr.delivery-row{color:var(--red)}

/* طريقة الدفع */
.pay-opts{padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.pay-opt{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1.5px solid var(--g200);border-radius:10px;cursor:pointer;transition:all .2s}
.pay-opt.selected{border-color:var(--g4);background:var(--gp)}
.pay-opt input[type=radio]{accent-color:var(--g4);width:16px;height:16px;flex-shrink:0}
.pay-ico{font-size:22px}
.pay-name{font-size:13px;font-weight:700}
.pay-desc{font-size:11px;color:var(--g400);margin-top:2px}

/* QR Reflect */
.qr-box{margin:0 14px 12px;background:var(--gx);border:1.5px dashed var(--g4);border-radius:var(--r);padding:18px;text-align:center;display:none}
.qr-box.show{display:block}
.qr-title{font-weight:900;color:var(--g1);font-size:14px;margin-bottom:4px}
.qr-sub{font-size:11.5px;color:var(--g400);margin-bottom:14px}
.qr-img{width:170px;height:170px;border-radius:12px;object-fit:contain;background:#fff;padding:8px;box-shadow:var(--sh);margin:0 auto 12px;display:block}
.qr-amount{font-size:20px;font-weight:900;color:var(--g2)}
.qr-amount-lbl{font-size:11px;color:var(--g400)}

/* زر الطلب المرفوع (فوق الملاحة) */
.order-btn-wrap {
    position: fixed;
    bottom: 65px; /* الارتفاع الدقيق لشريط التنقل السفلي */
    left: 0;
    right: 0;
    padding: 12px 14px 16px;
    background: #fff;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    z-index: 2500; /* ضمان الظهور فوق المحتوى */
    border-top: 1px solid var(--g200);
    display: block !important;
}
.order-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--g4), var(--g2));
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(46, 125, 50, 0.35);
    transition: all 0.2s;
    display: block !important;
}

/* --- الملاحة السفلية الاحترافية الموحدة --- */
.bnav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    height: 65px;
    display: flex;
    align-items: center;
    border-top: 1px solid rgba(0,0,0,0.05);
    z-index: 3000; /* ضمان الظهور كأعلى طبقة */
}
.bni {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-decoration: none;
    color: #8e8e93;
    position: relative;
    transition: 0.3s;
}
.bni.active { color: var(--g1); }
.bni-ico { font-size: 22px; display: flex; align-items: center; justify-content: center; }
.bni-lbl { font-size: 10px; font-weight: 700; }
.bni-badge {
    position: absolute; top: 4px; right: calc(50% - 18px);
    background: var(--acc); color: var(--g1); font-size: 9px; font-weight: 900;
    min-width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; border: 2px solid #fff;
}
.order-btn:active{transform:scale(.98)}
.order-btn:disabled{background:#ccc;box-shadow:none;cursor:not-allowed}

.empty{text-align:center;padding:40px 20px;color:var(--g400)}
.empty-ico{font-size:50px;margin-bottom:12px}

</style>
</head>
<body>

<div class="hdr">
  <button class="back-btn" onclick="history.back()">←</button>
  <div>
    <div class="hdr-title">🛒 سلة المشتريات</div>
    <div class="hdr-sub" id="cart-sub">جاري التحميل...</div>
  </div>
</div>
<!-- شريط التنبيه الذكي للمواعيد -->
<div id="delivery-alert-bar" style="margin: 12px 14px 0; padding: 10px 14px; border-radius: 12px; display: none; align-items: center; gap: 10px; border: 1.5px solid transparent; animation: slideUp 0.4s ease;">
  <span id="alert-icon" style="font-size: 18px;"></span>
  <div style="flex: 1;">
    <div id="alert-title" style="font-size: 12px; font-weight: 900;"></div>
    <div id="alert-desc" style="font-size: 10px; opacity: 0.8; margin-top: 1px;"></div>
  </div>
</div>

<style>
@keyframes slideUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.alert-green { background: #e8f5e9; border-color: #43a047 !important; color: #1b5e20; }
.alert-orange { background: #fff8e1; border-color: #ffb300 !important; color: #e65100; }
.alert-blue { background: #e3f2fd; border-color: #2196f3 !important; color: #0d47a1; }
</style>
<!-- المنتجات -->
<div class="section">
  <div class="sec-hdr">📦 المنتجات المختارة</div>
  <div id="cart-items"></div>
</div>

<!-- ملاحظات -->
<div class="section" style="margin-top:10px">
  <div class="sec-hdr">📝 ملاحظات</div>
  <textarea class="note-inp" id="notes" rows="2" placeholder="مثال: الجبنة قليلة الملح، الموز ناضج..."></textarea>
</div>

<!-- الفاتورة -->
<div class="section" style="margin-top:10px">
  <div class="sec-hdr">🧾 ملخص الفاتورة</div>
  <div class="summary">
    <div class="sr"><span>المنتجات</span><span id="sum-products">0₪</span></div>
    <div class="sr delivery-row"><span>🚗 رسوم التوصيل</span><span id="sum-delivery">{{ delivery_short }}₪</span></div>
    <div class="sr total"><span>الإجمالي</span><span id="sum-total">0₪</span></div>
  </div>
</div>

<!-- الدفع -->
<div class="section" style="margin-top:10px">
  <div class="sec-hdr">💳 طريقة الدفع</div>
  <div class="pay-opts">
    <label class="pay-opt selected" onclick="selectPay('cash',this)">
      <input type="radio" name="pay" value="cash" checked>
      <span class="pay-ico">💵</span>
      <div><div class="pay-name">كاش عند الاستلام</div><div class="pay-desc">ادفع لما يوصل المندوب</div></div>
    </label>
    <label class="pay-opt" onclick="selectPay('reflect',this)">
      <input type="radio" name="pay" value="reflect">
      <span class="pay-ico">📱</span>
      <div><div class="pay-name">محفظة Reflect</div><div class="pay-desc">دفع إلكتروني سريع عبر QR</div></div>
    </label>
  </div>
</div>

<!-- QR Reflect -->
<div class="qr-box" id="qr-box">
  <div class="qr-title">📱 ادفع عبر Reflect</div>
  <div class="qr-sub">افتح تطبيق Reflect وامسح الكود أدناه</div>
  <img class="qr-img" src="/static/reflect_qr.jpg" alt="Reflect QR Code">
  <div class="qr-amount-lbl">المبلغ المطلوب</div>
  <div class="qr-amount" id="qr-amount">0₪</div>
  <div style="font-size:11px;color:var(--g400);margin-top:8px">بعد الدفع اضغط "تأكيد الطلب"</div>
</div>

<!-- زر الطلب -->
<div class="order-btn-wrap">
  <button class="order-btn" id="main-order-btn" onclick="placeOrder()">✅ تأكيد الطلب الآن</button>
</div>
<nav class="bnav">
  <!-- المتجر: واجهة محل خضراء -->
  <a class="bni" href="/shop">
    <span class="bni-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#1b5e20"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
    </span>
    <span class="bni-lbl">المتجر</span>
  </a>

  <!-- السلة: سلة تسوق (نشط الآن) -->
  <a class="bni active" href="/cart">
    <span class="bni-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    </span>
    <span class="bni-lbl">السلة</span>
    <!-- عداد السلة يبقى متاحاً برمجياً -->
    <span class="bni-badge" id="nav-cart-count" style="display:none">0</span>
  </a>

  <!-- تواصل: واتساب ملون -->
  <a class="bni" href="/contact">
    <span class="bni-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </span>
    <span class="bni-lbl">تواصل</span>
  </a>

  <!-- طلباتي: دفتر سجل -->
  <a class="bni" href="/orders-history">
    <span class="bni-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </span>
    <span class="bni-lbl">طلباتي</span>
  </a>

  <!-- حسابي: بروفايل -->
  <a class="bni" href="/account">
    <span class="bni-ico">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </span>
    <span class="bni-lbl">حسابي</span>
  </a>
</nav>

<script>
let cart = JSON.parse(localStorage.getItem('dokkani_cart') || '[]');
let profile = JSON.parse(localStorage.getItem('dokkani_profile') || '{}');
let payMethod = 'cash';
const DELIVERY = {{ delivery_short }};

// دالة تحديث موعد التوصيل في السلة
function updateCartDeliveryNotice() {
  const hour = new Date().getHours();
  const bar = document.getElementById('delivery-alert-bar');
  const icon = document.getElementById('alert-icon');
  const title = document.getElementById('alert-title');
  const desc = document.getElementById('alert-desc');

  bar.style.display = 'flex';
  bar.className = ''; 

  if (hour >= 10 && hour < 16) {
    bar.classList.add('alert-green');
    icon.textContent = '🚀';
    title.textContent = 'سيصلك الطلب اليوم';
    desc.textContent = 'جولة التوصيل نشطة حالياً (خلال 45-60 دقيقة).';
  } else if (hour >= 16) {
    bar.classList.add('alert-orange');
    icon.textContent = '🚚';
    title.textContent = 'موعد التوصيل: غداً صباحاً';
    desc.textContent = 'تجاوزنا الرابعة عصراً، سيتم إيصال طلبك غداً الساعة 10:00 صباحاً.';
  } else {
    bar.classList.add('alert-blue');
    icon.textContent = '☀️';
    title.textContent = 'موعد التوصيل: 10:00 صباحاً';
    desc.textContent = 'سيصلك طلبك مع أول جولة اليوم عند الساعة العاشرة.';
  }
}
updateCartDeliveryNotice();

function renderCart(){
  const container = document.getElementById('cart-items');
  if(!cart.length){
    container.innerHTML = '<div class="empty"><div class="empty-ico">🛒</div><div>السلة فارغة</div></div>';
    document.getElementById('cart-sub').textContent = 'السلة فارغة';
    document.getElementById('main-order-btn').disabled = true;
    return;
  }
  container.innerHTML = cart.map((item,i) => `
    <div class="cart-item">
      <div class="ci-ico">${item.image ? `<img src="${item.image}">` : item.icon || '🛍️'}</div>
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-unit">${item.price}₪ / ${item.unit || 'حبة'}</div>
      </div>
      <div class="ci-qty">
        <button class="qb" onclick="changeQty(${i},-1)">−</button>
        <span class="qn">${item.qty}</span>
        <button class="qb" onclick="changeQty(${i},1)">+</button>
      </div>
      <div class="ci-price">${(item.price * item.qty).toFixed(1)}₪</div>
      <button class="del-btn" onclick="removeItem(${i})">🗑️</button>
    </div>
  `).join('');
  updateSummary();
}

function updateSummary(){
  const sub = cart.reduce((s,i)=>s+i.price*i.qty, 0);
  const total = sub + DELIVERY;
  const count = cart.reduce((s,i)=>s+i.qty, 0);
  document.getElementById('sum-products').textContent = sub.toFixed(1) + '₪';
  document.getElementById('sum-total').textContent = total.toFixed(1) + '₪';
  document.getElementById('cart-sub').textContent = count + ' منتج';
  document.getElementById('qr-amount').textContent = total.toFixed(1) + '₪';
}

function changeQty(i, delta){
  cart[i].qty = Math.max(1, cart[i].qty + delta);
  localStorage.setItem('dokkani_cart', JSON.stringify(cart));
  renderCart();
}

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem('dokkani_cart', JSON.stringify(cart));
  renderCart();
}

function selectPay(method, el){
  payMethod = method;
  document.querySelectorAll('.pay-opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('qr-box').classList.toggle('show', method==='reflect');
}

function placeOrder(){
  const btn = document.getElementById('main-order-btn');
  
  // 1. القفل الفوري والمنع
  if(btn.disabled) return; 
  if(!cart.length){ alert('⚠️ السلة فارغة!'); return; }
  if(!profile.name){ alert('⚠️ يرجى إكمال بيانات الملف الشخصي أولاً'); window.location.href='/'; return; }

  // 2. تعطيل الزر فوراً لمنع الضغط المتعدد
  btn.disabled = true;
  btn.textContent = '⏳ جاري إرسال طلبك...';

  const sub = cart.reduce((s,i)=>s+i.price*i.qty, 0);
  const total = sub + DELIVERY;

  // 3. تجميع البيانات بشكل نظيف (Aggregation)
  const orderData = {
    name: profile.name,
    phone: profile.phone,
    whatsapp: profile.whatsapp,
    neighborhood: profile.neighborhood,
    address: profile.address,
    lat: profile.lat,
    lng: profile.lng,
    items: cart.map(item => ({
      name: item.name,
      price: item.price,
      qty: item.qty,
      unit: item.unit || 'حبة'
    })),
    total: total,
    delivery: DELIVERY,
    payment: payMethod,
    notes: document.getElementById('notes').value
  };

  // 4. الإرسال للسيرفر
  fetch('/api/order', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(orderData)
  })
  .then(r => r.json())
  .then(data => {
    if(data.success){
      // ✅ حفظ رقم الطلب الموحد في ذاكرة المتصفح لتعرضه صفحة النجاح
      localStorage.setItem('dokkani_last_order', data.order_id);
      
      // نجاح: تفريغ السلة والتوجه لصفحة النجاح
      localStorage.removeItem('dokkani_cart');
      window.location.href = '/success';
    } else {
      // فشل من جهة السيرفر (مثل طلب مكرر)
      alert(data.message || '❌ حدث خطأ أثناء إرسال الطلب');
      btn.disabled = false;
      btn.textContent = '✅ تأكيد الطلب الآن';
    }
  })
  .catch(err => {
    console.error(err);
    alert('❌ فشل الاتصال بالسيرفر، تأكد من الإنترنت وحاول مجدداً');
    btn.disabled = false;
    btn.textContent = '✅ تأكيد الطلب الآن';
  });
}

renderCart();

// منع التكبير اليدوي لضمان استقرار التطبيق
document.addEventListener('touchstart', function(event) {
  if (event.touches.length > 1) { event.preventDefault(); }
}, { passive: false });
document.addEventListener('gesturestart', function(event) {
  event.preventDefault();
});
</script>
</body>
</html>
